name: Backup diário do banco (criptografado)

# Cópia EXTERNA do banco, fora do alcance de quem tiver acesso ao app ou ao Supabase por RLS.
# Gera um pg_dump do schema "public", criptografa (AES-256) e guarda como artefato por 30 dias.
# Passo a passo, segredos e restauração: veja docs/BACKUP_RESTORE.md

on:
  schedule:
    - cron: '17 6 * * *' # todo dia às 06:17 UTC (03:17 em Brasília)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-common gnupg
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Gerar dump do schema public
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Segredo SUPABASE_DB_URL não configurado (veja docs/BACKUP_RESTORE.md)."
            exit 1
          fi
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --schema=public --no-owner --no-privileges --format=custom \
            --file="stocck-$STAMP.dump"
          ls -l "stocck-$STAMP.dump"

      - name: Conferir que o dump está íntegro e completo
        run: |
          set -euo pipefail
          FILE="stocck-$STAMP.dump"
          test -s "$FILE"
          LIST="$(/usr/lib/postgresql/17/bin/pg_restore --list "$FILE")"
          for TABLE in products triage_units pending_items daily_inflows cases audit_logs users backup_snapshots; do
            if ! echo "$LIST" | grep -q "TABLE DATA public $TABLE "; then
              echo "::error::Dump sem os dados da tabela $TABLE."
              exit 1
            fi
          done
          echo "Dump legível e com as 8 tabelas do app."

      - name: Criptografar (AES-256)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::error::Segredo BACKUP_PASSPHRASE não configurado (veja docs/BACKUP_RESTORE.md)."
            exit 1
          fi
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "stocck-$STAMP.dump.gpg" "stocck-$STAMP.dump"
          # O dump em texto claro NÃO sai do runner: só o arquivo .gpg é publicado.
          shred -u "stocck-$STAMP.dump" || rm -f "stocck-$STAMP.dump"
          ls -l "stocck-$STAMP.dump.gpg"

      - name: Publicar o backup criptografado (30 dias)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.STAMP }}
          path: stocck-${{ env.STAMP }}.dump.gpg
          retention-days: 30
          if-no-files-found: error
