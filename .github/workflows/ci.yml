name: CI (lint, build e auditoria)

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # npm ci instala exatamente o que está no package-lock.json (falha se estiver fora de sincronia)
      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Build
        run: npm run build

      # Falhas CRÍTICAS bloqueiam; as de gravidade alta aparecem como aviso (veja o log)
      - name: Audit (bloqueia crítica)
        run: npm audit --audit-level=critical

      - name: Audit (avisa gravidade alta)
        run: npm audit --audit-level=high || echo "::warning::npm audit encontrou vulnerabilidades de gravidade alta. Veja o log do passo."
