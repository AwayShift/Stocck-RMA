version: 2
updates:
  # Dependências do projeto (npm). O Dependabot só abre pull requests; nada entra sozinho.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # xlsx vem do site do fabricante (cdn.sheetjs.com), não do npm: atualizar manualmente.
    ignore:
      - dependency-name: "xlsx"
      # Vite, plugin do React, plugin do Tailwind e esbuild sobem juntos: versões MAIORES exigem
      # uma migração planejada (testar build e telas). Menores e correções continuam chegando.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "esbuild"
        update-types: ["version-update:semver-major"]

  # Versões das ações usadas nos workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
