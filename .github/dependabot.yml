version: 2
updates:
  # Dependências do projeto (npm). O Dependabot só abre pull requests; nada entra sozinho.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # xlsx vem do site do fabricante (cdn.sheetjs.com), não do npm: atualizar manualmente.
    ignore:
      - dependency-name: "xlsx"

  # Versões das ações usadas nos workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
